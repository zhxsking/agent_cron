<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型经典论文精读系列 · 论文全览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #F4EFE4;
    --bg2:     #ECE4D4;
    --ink:     #2E2A22;
    --muted:   #96897A;
    --rule:    #96897A;
    --accent:  #B54A2C;
    --accent2: #24555A;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Lora',serif;
    font-size:18px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:820px; margin:0 auto; padding:72px 28px 120px; }

  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--accent2);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  h1{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:38px;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--muted);
    font-size:17px;
    margin:0 0 8px;
  }
  .stats{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
    margin:8px 0 56px;
  }
  .stats b{ color:var(--accent); font-weight:600; }

  /* ---------- 时间线主干 ---------- */
  .timeline{
    position:relative;
    margin-top:8px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:54px;
    top:6px;
    bottom:6px;
    width:1px;
    background:var(--rule);
    opacity:0.5;
  }

  /* ---------- 时代分组 ---------- */
  .era{
    margin-bottom:8px;
  }
  .era-label{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent2);
    padding:32px 0 16px 84px;
  }

  /* ---------- 单篇文章条目 ---------- */
  .entry{
    position:relative;
    display:flex;
    align-items:baseline;
    gap:20px;
    padding:14px 0 14px 84px;
    text-decoration:none;
    color:var(--ink);
  }
  .entry:hover .entry-title{ color:var(--accent); }
  .entry-dot{
    position:absolute;
    left:50px;
    top:22px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--bg);
    border:1.5px solid var(--accent2);
  }
  .entry-num{
    position:absolute;
    left:0;
    top:14px;
    width:36px;
    text-align:right;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
  }
  .entry-body{ flex:1; min-width:0; }
  .entry-title{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:17px;
    display:block;
    margin-bottom:3px;
  }
  .entry-title .zh{ color:var(--muted); font-weight:400; font-size:15px; }
  .entry-date{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  .rule{ border:none; border-top:1px solid var(--rule); margin:56px 0 0; }

  footer{
    margin-top:56px;
    padding-top:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }

  @media (max-width:600px){
    .page{ padding:48px 16px 90px; }
    h1{ font-size:28px; }
    .timeline::before{ left:40px; }
    .era-label, .entry{ padding-left:64px; }
    .entry-dot{ left:36px; }
    .entry-num{ width:26px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="kicker">大模型经典论文精读系列</div>
  <h1>论文全览</h1>
  <p class="sub">按发表时间脉络排列，从起步到现状，一篇接一篇读懂大模型的发展史。</p>
  <div class="stats">已更新 <b>[N]</b> 篇 · 最近更新于 <b>[YYYY-MM-DD]</b></div>

  <div class="timeline">

    <!-- ============ 时代分组示例：替换为实际分组与条目 ============ -->
    <div class="era">
      <div class="era-label">[时代分组名，如：奠基期 2014–2017]</div>

      <a class="entry" href="[001_文件名.html]">
        <span class="entry-num">001</span>
        <span class="entry-dot"></span>
        <span class="entry-body">
          <span class="entry-title">[论文原文标题] <span class="zh">· [中文意译标题]</span></span>
        </span>
        <span class="entry-date">[YYYY-MM-DD]</span>
      </a>

      <a class="entry" href="[002_文件名.html]">
        <span class="entry-num">002</span>
        <span class="entry-dot"></span>
        <span class="entry-body">
          <span class="entry-title">[论文原文标题] <span class="zh">· [中文意译标题]</span></span>
        </span>
        <span class="entry-date">[YYYY-MM-DD]</span>
      </a>
    </div>

    <div class="era">
      <div class="era-label">[时代分组名，如：预训练范式期 2018–2019]</div>

      <a class="entry" href="[003_文件名.html]">
        <span class="entry-num">003</span>
        <span class="entry-dot"></span>
        <span class="entry-body">
          <span class="entry-title">[论文原文标题] <span class="zh">· [中文意译标题]</span></span>
        </span>
        <span class="entry-date">[YYYY-MM-DD]</span>
      </a>
    </div>
    <!-- ============ 分组示例结束，实际生成时按 progress.json 中的 era 字段分组、按 index 顺序列出全部条目 ============ -->

  </div>

  <hr class="rule">
  <footer>大模型经典论文精读系列 · 索引页由任务自动生成与维护</footer>

</div>
</body>
</html>
